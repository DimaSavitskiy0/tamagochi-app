version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tamagochi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт наружу не открываем — только api достаёт до postgres внутри docker-сети.

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/tamagochi?schema=public"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3000
      PRO_PLAN_PRICE_RUB: ${PRO_PLAN_PRICE_RUB:-199.00}
      APP_RETURN_URL: ${APP_RETURN_URL:-}
      # Опционально: без них ИИ-совет/RuStore Pay/Push просто не работают (503 на
      # соответствующих роутах), остальной сервис не ломается.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RUSTORE_WEBHOOK_SECRET: ${RUSTORE_WEBHOOK_SECRET:-}
      RUSTORE_PUSH_PROJECT_ID: ${RUSTORE_PUSH_PROJECT_ID:-}
      RUSTORE_PUSH_AUTH_TOKEN: ${RUSTORE_PUSH_AUTH_TOKEN:-}
      RUSTORE_API_TOKEN: ${RUSTORE_API_TOKEN:-}
      RUSTORE_API_KEY_ID: ${RUSTORE_API_KEY_ID:-}
      RUSTORE_APP_ID: ${RUSTORE_APP_ID:-}
      RUSTORE_SUBSCRIPTION_PRODUCT_CODE: ${RUSTORE_SUBSCRIPTION_PRODUCT_CODE:-lapgo_pro_monthly}
      # Опционально: без SMTP_HOST код восстановления пароля просто логируется
      # в консоль контейнера вместо реальной отправки письмом.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    # Только на localhost сервера — для проверки через curl по SSH.
    ports:
      - "127.0.0.1:3001:3000"
    # api сам входит в сеть общего Caddy (family-navigator-backend), поэтому связь
    # переживает пересоздание/перезапуск Caddy. Раньше Caddy подключали к нашей сети
    # вручную (`docker network connect`) — такое подключение теряется при пересоздании Caddy.
    networks:
      - default
      - caddy

volumes:
  postgres_data:

networks:
  caddy:
    external: true
    # Проверить точное имя: `docker network ls` на сервере.
    name: family-navigator-backend_default
